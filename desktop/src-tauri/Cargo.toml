[package]
name = "kernel-keep"
version = "0.3.4"
description = "Kernel Keep — optional native window around the offline browser build"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# Plain `cargo build --features custom-protocol` (or `cargo tauri build`) serves the bundled ../../dist files;
# without it Tauri expects a dev server.
custom-protocol = ["tauri/custom-protocol"]
